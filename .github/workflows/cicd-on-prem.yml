name: test & deploy Geharbang RAG

on:
  workflow_dispatch:
  push:
    branches:
      - rag

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: checkout repository
        uses: actions/checkout@v4

      - name: set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: run unit tests
        run: python -m unittest discover -s tests

  deploy:
    if: github.repository == 'JNU-econovation/Geharbang-AI'
    runs-on: self-hosted
    needs: test
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: gemini-3.1-flash-lite
      AI_DATA_KEY: ${{ secrets.AI_DATA_KEY }}
    steps:
      - name: checkout repository
        uses: actions/checkout@v4

      - name: ensure Docker and private network are ready
        run: |
          set -euo pipefail
          open -a Docker
          ITER=0
          until docker info >/dev/null 2>&1 || [ "$ITER" -eq 12 ]; do
            sleep 5
            ITER=$((ITER+1))
          done
          docker info >/dev/null
          docker network inspect guesthouse >/dev/null 2>&1 || docker network create guesthouse
          test -n "$GEMINI_API_KEY"
          test -n "$AI_DATA_KEY"

      - name: build and start RAG server
        run: docker compose -p geharbang-rag -f docker-compose.prod.yml up -d --build --force-recreate

      - name: build initial indexes from production DB
        run: docker compose -p geharbang-rag -f docker-compose.prod.yml exec -T rag-ai python rebuild_index.py --domain all

      - name: verify production readiness
        run: |
          set -euo pipefail
          curl --fail --retry 12 --retry-delay 5 --retry-all-errors http://127.0.0.1:8001/ready
